version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: yourusername
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: YourDatabaseName
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    depends_on:
      - db
    working_dir: /app
    volumes:
      - .:/app
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=YourDatabaseName;Username=yourusername;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: >
      bash -c "dotnet tool install --global dotnet-ef --version 8.0.7 &&
               export PATH=\"$$PATH:/root/.dotnet/tools\" &&
               dotnet ef database update --project src/Infrastructure/Infrastructure.csproj --startup-project src/Web/Web.csproj"

  web:
    build:
      context: .
      dockerfile: backend.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtSettings__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      RootUser__Password: ${ROOT_USER_PASSWORD:?Set ROOT_USER_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=db;Database=YourDatabaseName;Username=yourusername;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "8080:80"

volumes:
  pgdata:
